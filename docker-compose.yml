services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: csv2trust
      POSTGRES_PASSWORD: csv2trust
      POSTGRES_DB: csv2trust
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csv2trust"]
      interval: 5s
      retries: 10

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg2://csv2trust:csv2trust@postgres:5432/csv2trust
      DATA_DIR: /data
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-150}
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
